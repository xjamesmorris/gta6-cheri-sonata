name: Browser checks and gated Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after the owner has approved publication and configured Pages
        type: boolean
        required: true
        default: false

permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          enable_kvm: false
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Allow the Nix Chromium user-namespace sandbox
        run: |
          cat > "$RUNNER_TEMP/sonata-nix-chromium.apparmor" <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile sonata-nix-chromium /nix/store/*-chromium-unwrapped-*/libexec/chromium/chromium flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo -n apparmor_parser -r "$RUNNER_TEMP/sonata-nix-chromium.apparmor"
      - name: Check the locked browser build
        run: nix develop --accept-flake-config --no-write-lock-file .#preview -c ./tools/check-browser
      - name: Package only the static site
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy && vars.PAGES_PUBLICATION_APPROVED == 'true'
        run: |
          mkdir -p build/pages-site
          cp build/game-preview/index.html build/game-preview/preview.js \
            build/game-preview/game.js build/game-preview/game.wasm \
            build/game-preview/artwork-license.txt build/game-preview/code-license.txt \
            build/pages-site/
      - name: Upload the approved Pages artifact
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy && vars.PAGES_PUBLICATION_APPROVED == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/pages-site
          retention-days: 1

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy && vars.PAGES_PUBLICATION_APPROVED == 'true'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read existing Pages configuration without enabling it
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
